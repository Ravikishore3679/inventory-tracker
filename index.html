<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Tracker</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --line:#e2e6ea; --accent:#d9480f; --text:#212529; --muted:#6c757d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--accent); color:#fff; padding:14px 20px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  header h1 { margin:0; font-size:20px; }
  main { max-width:1200px; margin:16px auto; padding:0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:14px; }
  .stats { display:flex; flex-wrap:wrap; gap:12px; }
  .stat { flex:1 1 140px; }
  .stat b { display:block; font-size:22px; }
  .stat span { color:var(--muted); font-size:12px; text-transform:uppercase; }
  form { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:10px; align-items:end; }
  label { font-size:12px; color:var(--muted); display:block; margin-bottom:3px; }
  input, select { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; font-size:14px; background:#fff; }
  button { padding:8px 14px; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; font-size:14px; }
  button.secondary { background:#495057; }
  button.light { background:#fff; color:var(--accent); }
  button.small { padding:4px 9px; font-size:12px; }
  button.danger { background:#c92a2a; }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  .toolbar input, .toolbar select { width:auto; flex:1 1 180px; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  th { background:#f8f9fa; cursor:pointer; user-select:none; position:sticky; top:0; }
  th.num, td.num { text-align:right; }
  tr:hover td { background:#fff8f3; }
  tr.zero td { color:#adb5bd; }
  tfoot td { font-weight:700; background:#f8f9fa; }
  .empty { text-align:center; color:var(--muted); padding:30px; }
  .actions { display:flex; gap:6px; }
</style>
</head>
<body>
<header>
  <h1>📦 Inventory Tracker</h1>
  <div class="actions">
    <button class="light" id="importBtn">Import CSV</button>
    <button class="light" id="exportBtn">Export CSV</button>
    <button class="light" id="clearBtn">Clear All</button>
    <input type="file" id="fileInput" accept=".csv,text/csv" hidden>
  </div>
</header>

<main>
  <div class="card stats">
    <div class="stat"><b id="sItems">0</b><span>Items</span></div>
    <div class="stat"><b id="sCartons">0</b><span>Total Cartons</span></div>
    <div class="stat"><b id="sPieces">0</b><span>Total Pieces</span></div>
    <div class="stat"><b id="sValue">0</b><span>Total Value</span></div>
  </div>

  <div class="card">
    <form id="form">
      <input type="hidden" id="editId">
      <div><label for="category">Category</label><input id="category" list="categories" required></div>
      <div><label for="name">Name</label><input id="name" required></div>
      <div><label for="company">Company</label><input id="company" list="companies"></div>
      <div><label for="cartons">Qty in Cartons</label><input id="cartons" type="number" min="0" step="any" value="0"></div>
      <div><label for="unitsPerCarton">Units/Carton</label><input id="unitsPerCarton" type="number" min="0" step="any" value="0"></div>
      <div><label for="pieces">Pieces</label><input id="pieces" type="number" min="0" step="any" value="0"></div>
      <div><label for="value">Value</label><input id="value" type="number" min="0" step="any" value="0"></div>
      <div class="actions">
        <button type="submit" id="saveBtn">Add Item</button>
        <button type="button" class="secondary" id="cancelBtn" hidden>Cancel</button>
      </div>
    </form>
    <datalist id="categories"></datalist>
    <datalist id="companies"></datalist>
  </div>

  <div class="card">
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search name, category, company…">
      <select id="filterCategory"><option value="">All categories</option></select>
      <select id="filterCompany"><option value="">All companies</option></select>
      <label style="align-self:center;display:flex;gap:6px;align-items:center;margin:0">
        <input type="checkbox" id="hideZero" style="width:auto"> Hide zero stock
      </label>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="body"></tbody>
        <tfoot id="foot"></tfoot>
      </table>
    </div>
  </div>
</main>

<script>
const STORAGE_KEY = 'inventory-tracker-v1';
const COLUMNS = [
  { key:'category', label:'Category' },
  { key:'name', label:'Name' },
  { key:'company', label:'Company' },
  { key:'cartons', label:'Qty in Cartons', num:true },
  { key:'unitsPerCarton', label:'Units/Carton', num:true },
  { key:'pieces', label:'Pieces', num:true },
  { key:'totalPieces', label:'Total Pieces', num:true },
  { key:'value', label:'Value', num:true },
];

let items = load();
let sort = { key:'category', dir:1 };
const $ = id => document.getElementById(id);

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const totalPieces = i => i.cartons * i.unitsPerCarton + i.pieces;
const fmt = n => n.toLocaleString(undefined, { maximumFractionDigits: 2 });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const getVal = (i, k) => k === 'totalPieces' ? totalPieces(i) : i[k];

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function filtered() {
  const q = $('search').value.trim().toLowerCase();
  const cat = $('filterCategory').value, comp = $('filterCompany').value;
  const hideZero = $('hideZero').checked;
  return items.filter(i =>
    (!q || [i.category, i.name, i.company].some(s => s.toLowerCase().includes(q))) &&
    (!cat || i.category === cat) && (!comp || i.company === comp) &&
    (!hideZero || totalPieces(i) > 0 || i.value > 0)
  ).sort((a, b) => {
    const x = getVal(a, sort.key), y = getVal(b, sort.key);
    const r = typeof x === 'number' ? x - y : String(x).localeCompare(String(y), undefined, { numeric:true });
    return r * sort.dir || a.name.localeCompare(b.name);
  });
}

function refreshLists() {
  const cats = [...new Set(items.map(i => i.category).filter(Boolean))].sort();
  const comps = [...new Set(items.map(i => i.company).filter(Boolean))].sort();
  const fill = (el, list, first) => {
    const cur = el.value;
    el.innerHTML = (first ? `<option value="">${first}</option>` : '') +
      list.map(v => `<option value="${esc(v)}">${first ? esc(v) + '</option>' : ''}`).join('');
    if (first) el.value = list.includes(cur) ? cur : '';
  };
  fill($('categories'), cats); fill($('companies'), comps);
  fill($('filterCategory'), cats, 'All categories'); fill($('filterCompany'), comps, 'All companies');
}

function render() {
  $('head').innerHTML = COLUMNS.map(c =>
    `<th class="${c.num ? 'num' : ''}" data-key="${c.key}">${c.label}${sort.key === c.key ? (sort.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`
  ).join('') + '<th></th>';

  const rows = filtered();
  $('body').innerHTML = rows.length ? rows.map(i => `
    <tr class="${totalPieces(i) === 0 && i.value === 0 ? 'zero' : ''}">
      <td>${esc(i.category)}</td><td>${esc(i.name)}</td><td>${esc(i.company)}</td>
      <td class="num">${fmt(i.cartons)}</td><td class="num">${fmt(i.unitsPerCarton)}</td>
      <td class="num">${fmt(i.pieces)}</td><td class="num">${fmt(totalPieces(i))}</td>
      <td class="num">${fmt(i.value)}</td>
      <td><div class="actions">
        <button class="small secondary" data-edit="${i.id}">Edit</button>
        <button class="small danger" data-del="${i.id}">Delete</button>
      </div></td>
    </tr>`).join('') : `<tr><td colspan="9" class="empty">No items. Add one above or import a CSV.</td></tr>`;

  const sum = k => rows.reduce((s, i) => s + getVal(i, k), 0);
  $('foot').innerHTML = `<tr><td colspan="3">Total (${rows.length} shown)</td>
    <td class="num">${fmt(sum('cartons'))}</td><td></td><td class="num">${fmt(sum('pieces'))}</td>
    <td class="num">${fmt(sum('totalPieces'))}</td><td class="num">${fmt(sum('value'))}</td><td></td></tr>`;

  $('sItems').textContent = items.length;
  $('sCartons').textContent = fmt(items.reduce((s, i) => s + i.cartons, 0));
  $('sPieces').textContent = fmt(items.reduce((s, i) => s + totalPieces(i), 0));
  $('sValue').textContent = fmt(items.reduce((s, i) => s + i.value, 0));
}

function update() { save(); refreshLists(); render(); }

function resetForm() {
  $('form').reset();
  $('editId').value = '';
  ['cartons', 'unitsPerCarton', 'pieces', 'value'].forEach(k => $(k).value = 0);
  $('saveBtn').textContent = 'Add Item';
  $('cancelBtn').hidden = true;
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const data = {
    category: $('category').value.trim().toUpperCase(),
    name: $('name').value.trim().toUpperCase(),
    company: $('company').value.trim().toUpperCase(),
    cartons: num($('cartons').value), unitsPerCarton: num($('unitsPerCarton').value),
    pieces: num($('pieces').value), value: num($('value').value),
  };
  const id = $('editId').value;
  if (id) Object.assign(items.find(i => i.id === id), data);
  else items.push({ id: uid(), ...data });
  resetForm(); update();
  $('category').focus();
});
$('cancelBtn').addEventListener('click', resetForm);

$('body').addEventListener('click', e => {
  const ed = e.target.dataset.edit, del = e.target.dataset.del;
  if (ed) {
    const i = items.find(x => x.id === ed);
    $('editId').value = i.id;
    ['category', 'name', 'company', 'cartons', 'unitsPerCarton', 'pieces', 'value'].forEach(k => $(k).value = i[k]);
    $('saveBtn').textContent = 'Update Item';
    $('cancelBtn').hidden = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else if (del) {
    const i = items.find(x => x.id === del);
    if (confirm(`Delete ${i.category} - ${i.name} (${i.company})?`)) { items = items.filter(x => x.id !== del); update(); }
  }
});

$('head').addEventListener('click', e => {
  const key = e.target.dataset.key;
  if (!key) return;
  sort = { key, dir: sort.key === key ? -sort.dir : 1 };
  render();
});
['search', 'filterCategory', 'filterCompany', 'hideZero'].forEach(id => $(id).addEventListener('input', render));

/* ---------- CSV ---------- */
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  text = text.replace(/^\uFEFF/, '');
  for (let n = 0; n < text.length; n++) {
    const c = text[n];
    if (q) {
      if (c === '"') { if (text[n + 1] === '"') { cur += '"'; n++; } else q = false; } else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[n + 1] === '\n') n++;
      row.push(cur); cur = ''; rows.push(row); row = [];
    } else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

const HEADER_MAP = {
  category:'category', catagory:'category', name:'name', company:'company',
  cartons:'cartons', 'qtyincartons':'cartons', qty:'cartons',
  'units/carton':'unitsPerCarton', unitspercarton:'unitsPerCarton', unitscarton:'unitsPerCarton', 'unitspercarton':'unitsPerCarton',
  pieces:'pieces', value:'value',
};
const norm = h => h.toLowerCase().replace(/[\s_-]/g, '');

function importCSV(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) return alert('CSV has no data rows.');
  const cols = rows[0].map(h => HEADER_MAP[norm(h)] || null);
  if (!cols.includes('name')) return alert('CSV needs a "Name" column.');
  const imported = rows.slice(1).map(r => {
    const o = { id: uid(), category:'', name:'', company:'', cartons:0, unitsPerCarton:0, pieces:0, value:0 };
    cols.forEach((k, idx) => {
      if (!k) return;
      const v = (r[idx] || '').trim();
      o[k] = ['cartons', 'unitsPerCarton', 'pieces', 'value'].includes(k) ? num(v) : v.toUpperCase();
    });
    return o;
  }).filter(o => o.name);
  const replace = items.length && confirm(`Imported ${imported.length} rows.\nOK = replace existing data, Cancel = append to it.`);
  items = replace || !items.length ? imported : items.concat(imported);
  update();
}

$('importBtn').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) f.text().then(importCSV);
  e.target.value = '';
});

$('exportBtn').addEventListener('click', () => {
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const lines = [['Category', 'Name', 'Company', 'Qty in Cartons', 'Units/Carton', 'Pieces', 'Value'].join(',')]
    .concat(items.map(i => [q(i.category), q(i.name), q(i.company), i.cartons, i.unitsPerCarton, i.pieces, i.value].join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type:'text/csv' }));
  a.download = 'inventory.csv';
  a.click();
  URL.revokeObjectURL(a.href);
});

$('clearBtn').addEventListener('click', () => {
  if (items.length && confirm('Delete ALL items? This cannot be undone.')) { items = []; update(); }
});

refreshLists();
render();
</script>
</body>
</html>
